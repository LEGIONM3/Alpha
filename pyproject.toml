[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-alpha"
version = "2.0.0"
description = "Project Alpha: Tool-Augmented Cognitive Operating System & Apple Silicon Mac Computer-Use Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "psutil>=5.9.8,<8.0.0",
    "playwright>=1.44.0,<2.0.0",
    "networkx>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
mac-agent = [
    "pydantic>=2.7.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "psutil>=5.9.8,<8.0.0",
    "playwright>=1.44.0,<2.0.0",
    "pytest>=8.0.0,<10.0.0",
]
ui = [
    "httpx>=0.27.0,<1.0.0",
    "rich>=13.7.0,<16.0.0",
    "textual>=0.60.0,<9.0.0",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[project.scripts]
alpha-mac-agent = "alpha.computer_use.mac_agent.cli:main"

[tool.setuptools.packages.find]
include = ["alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
